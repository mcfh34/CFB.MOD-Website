name: Apply team record context

on:
  push:
    branches:
      - agent/schedule-projected-records
    paths:
      - scripts/apply-team-record-context.py
      - .github/workflows/apply-team-record-context.yml
  pull_request:
    branches:
      - main
    paths:
      - scripts/apply-team-record-context.py
      - .github/workflows/apply-team-record-context.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: agent/schedule-projected-records
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Apply full-season record context
        run: python3 scripts/apply-team-record-context.py
      - name: Install dependencies
        run: npm ci --ignore-scripts --silent
      - name: Run verified build and tests
        run: npm test
      - name: Commit corrected schedule behavior
        run: |
          rm scripts/apply-team-record-context.py
          rm .github/workflows/apply-team-record-context.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/page.tsx scripts/apply-team-record-context.py .github/workflows/apply-team-record-context.yml
          git commit -m "Keep team projected records cumulative across week filters"
          git push origin HEAD
