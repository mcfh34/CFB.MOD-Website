name: Apply team projected records

on:
  push:
    branches:
      - agent/schedule-projected-records
    paths:
      - scripts/apply-team-projected-records.py
      - .github/workflows/apply-team-projected-records.yml
  pull_request:
    branches:
      - main
    paths:
      - lib/teamProjectedRecords.ts
      - scripts/apply-team-projected-records.py
      - .github/workflows/apply-team-projected-records.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: agent/schedule-projected-records
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Apply targeted source changes
        run: python3 scripts/apply-team-projected-records.py
      - name: Install dependencies
        run: npm ci --ignore-scripts --silent
      - name: Type-check
        id: typecheck
        continue-on-error: true
        run: npx tsc --noEmit --pretty false > typecheck.log 2>&1
      - name: Upload compiler diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: projected-record-typecheck
          path: typecheck.log
      - name: Stop on compiler errors
        if: steps.typecheck.outcome == 'failure'
        run: exit 1
      - name: Run model logic tests
        run: node --import tsx --test tests/model-logic.test.ts
      - name: Commit feature changes
        run: |
          rm scripts/apply-team-projected-records.py
          rm .github/workflows/apply-team-projected-records.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/page.tsx lib/teamProjectedRecords.ts tests/model-logic.test.ts scripts/apply-team-projected-records.py .github/workflows/apply-team-projected-records.yml
          git commit -m "Show projected records on team schedules"
          git push origin HEAD
